services:
  # Add project microservices here when generated services exist.
  #
  # Example:
  # user-api:
  #   build:
  #     context: ../..
  #     dockerfile: services/user/api/Dockerfile
  #   profiles: ["minimal", "integration", "observability"]
  #   env_file:
  #     - ./.env
  #   volumes:
  #     - ../../services/user/api/etc:/app/etc:ro
  #   ports:
  #     - "${USER_API_PORT:-8888}:8888"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  postgres:
    image: postgres:16
    profiles: ["minimal", "integration", "observability"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gonna}
      POSTGRES_USER: ${POSTGRES_USER:-gonna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gonna_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gonna} -d ${POSTGRES_DB:-gonna}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    profiles: ["integration", "observability"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["integration", "observability"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
